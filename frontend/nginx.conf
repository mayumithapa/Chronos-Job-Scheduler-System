# Chronos frontend — serves the Vite SPA and reverse-proxies the API.
#
# Container layout (docker-compose service names):
#   - frontend (this container)  → port 80, exposed on host as 5173
#   - api      (backend service) → port 4000 on the docker network

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't cache index.html — we want users to pick up new builds immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Long-cache hashed JS/CSS bundles (Vite emits content-hashed filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any unmatched non-asset path returns index.html so React
    # Router can take over client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the JSON API.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Bull Board admin UI (live queue stats).
    location /admin/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health probe (handy for `docker compose` healthchecks against the front).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
